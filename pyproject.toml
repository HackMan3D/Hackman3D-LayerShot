[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hackman3d-layershot"
version = "1.2.8"
description = "Cross-platform LayerShot configuration and timelapse app"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "pyserial>=3.5,<4",
    "imageio-ffmpeg==0.6.0",
    "esptool>=5.1,<6; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.8,<7"]

[project.scripts]
hackman3d-layershot = "hackman_layershot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hackman_layershot = ["assets/*"]
